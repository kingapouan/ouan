<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>OUAN – กินกับอ้วน</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#5271ff;--yellow:#f4d06a;--sun:#ffd562;--ink:#555;--bg:#fffdf6;--card:#fff;--line:#f0e9d2;--soft:#eef1ff;--text:#2b2f45;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Mali','Noto Sans Thai',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:150px;position:relative}
header{display:flex;align-items:center;gap:12px;padding:16px 18px 6px}
header img{width:64px;height:64px;border-radius:16px;background:#fff;object-fit:cover}
header h1{margin:0;font-size:20px;line-height:1.2;color:var(--blue)}
header p{margin:2px 0 0;font-size:13px;color:var(--ink)}
.hero{margin:12px 18px;padding:18px;border-radius:24px;background:var(--sun);color:#3a3000;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero b{font-size:20px;display:block;margin-bottom:4px}.hero span{font-size:13px}
.hero i{font-style:normal;font-size:52px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 18px 10px;scrollbar-width:none}
.chips button{flex:none;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;padding:8px 16px;border-radius:99px}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 18px}
.item{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column}
.pic{height:88px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:48px}
.item h3{margin:10px 0 2px;font-size:15px}.item small{color:var(--ink);font-size:12px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.price{font-weight:700;color:var(--blue)}
.add,.qty button{width:34px;height:34px;border-radius:50%;border:0;background:var(--blue);color:#fff;font:700 20px/1 inherit;cursor:pointer}
.qty{display:flex;align-items:center;gap:8px;font-weight:700}.qty button.m{background:var(--soft);color:var(--blue)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:452px;background:var(--blue);color:#fff;border:0;border-radius:20px;padding:14px 18px;display:flex;justify-content:space-between;font:700 16px 'Mali',sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(82,113,255,.35)}
.bar[hidden]{display:none}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:12px;padding:10px 0 12px;cursor:pointer}
nav button b{display:block;font-size:22px;font-weight:400}nav button.on{color:var(--blue);font-weight:700}
.view{display:none}.view.on{display:block}
.pad{padding:8px 18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border:0}
input,textarea,select{width:100%;font:inherit;font-size:15px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:10px}
label{font-size:13px;color:var(--ink)}
.cta{width:100%;border:0;border-radius:18px;background:var(--blue);color:#fff;font:700 17px 'Mali',sans-serif;padding:15px;cursor:pointer}
#qr{display:grid;place-items:center;padding:12px;background:#fff;border-radius:16px;margin:8px 0}.slip{max-width:100%;max-height:200px;border-radius:12px;margin:6px 0}.slip[hidden]{display:none}.cta:disabled{opacity:.6}.modal{position:fixed;inset:0;background:rgba(43,47,69,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}.modal[hidden]{display:none}.sheet{width:100%;max-width:480px;background:var(--card);border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));border:3px solid var(--blue);border-bottom:0}.sheet h3{margin:0 0 2px;font-size:18px}.opt{display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;font-size:16px;font-weight:600;padding:14px 16px;margin-top:10px;border-radius:18px;border:2.5px solid var(--blue);background:var(--bg);color:var(--text);cursor:pointer}.opt b{color:var(--blue)}.opt:active{background:var(--sun)}.sw{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.sw button{border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:11px;padding:3px 8px;border-radius:99px;cursor:pointer}.sw button.on{background:var(--sun);border-color:var(--sun);color:#3a3000;font-weight:700}
body{background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px);background-size:22px 22px}
header img{border:3px solid var(--yellow);border-radius:22px;transform:rotate(-4deg)}
header h1{font-size:22px}
.hero{border-radius:30px 30px 30px 8px;box-shadow:4px 4px 0 var(--blue)}
.eyes{display:flex;gap:6px;margin-right:6px;position:relative;margin-top:16px}
.eyes:before{content:'👑';position:absolute;top:-24px;left:-6px;font-size:22px;transform:rotate(-15deg)}
.eye{width:34px;height:46px;background:#fff;border:3px solid #3a3000;border-radius:50%;position:relative;overflow:hidden;animation:bl 4.5s infinite}
.eye i{position:absolute;width:16px;height:22px;background:#3a3000;border-radius:50%;left:7px;top:12px;font-size:0;transition:transform .08s}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.eye{animation:none}}
.chips button{border-width:2.5px;font-weight:600}.chips button.on{box-shadow:0 3px 0 #3550d6}
.item{border:2.5px solid var(--blue);border-radius:26px 26px 26px 10px;box-shadow:3px 4px 0 var(--sun)}
.pic{height:96px;font-size:54px;border-radius:20px;background:radial-gradient(circle at 30% 25%,#fff7d6,var(--soft))}
.add,.qty button,.cta{box-shadow:0 3px 0 #3550d6}.add:active,.qty button:active,.cta:active{transform:translateY(2px) scale(.96);box-shadow:none}
.qty button.m{box-shadow:none}
.bar{border-radius:99px;box-shadow:0 5px 0 #3550d6,0 10px 20px rgba(82,113,255,.3)}
nav{border-radius:26px 26px 0 0;border:2.5px solid var(--line);border-bottom:0}
.card{border-radius:24px}
.qrwrap{position:relative;background:var(--sun);border-radius:30px 30px 30px 8px;padding:16px 14px 14px;box-shadow:4px 4px 0 var(--blue);text-align:center;margin:12px 0;color:#3a3000}
.qrwrap:before{content:'👑';position:absolute;top:-16px;left:14px;font-size:26px;transform:rotate(-15deg)}
.qrwrap b{display:block;font-size:16px;margin-bottom:8px}
.qrwrap #qr{position:relative;width:max-content;margin:0 auto;padding:14px;border-radius:22px;border:3px dashed var(--blue)}
.qlogo{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:12px;border:3px solid #fff;background:#fff;object-fit:cover}
.amt{display:inline-block;margin-top:10px;background:var(--blue);color:#fff;font-weight:700;font-size:20px;padding:6px 20px;border-radius:99px;box-shadow:0 3px 0 #3550d6}.empty{text-align:center;color:var(--ink);padding:40px 10px}.empty i{font-style:normal;font-size:52px;display:block}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;transition:transform .25s;z-index:9}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.pic{overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}
.line img{width:34px;height:34px;border-radius:10px;object-fit:cover;vertical-align:middle}.line img{width:30px;height:30px;border-radius:8px;object-fit:cover;vertical-align:middle}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<script>
const MENU=[
// img: ใส่ path หรือ URL รูป (เช่น 'images/banoffee.jpg') ถ้าเว้นว่างจะใช้อิโมจิ e แทน
{id:1,c:'เค้ก',n:'เค้กบานนอฟฟี่',d:'ชิ้นใหญ่ เข้มข้น',p:35,e:'🍫',img:''},
{id:2,c:'เค้ก',n:'เค้กบานนอฟฟี่สตอเบอร์รี่',d:'หน้านุ่ม ซอสเปรี้ยวหวาน',p:39,e:'🍓',img:''},
{id:10,c:'เครื่องดื่ม',n:'ชาอ้วน',d:'หวานมัน ชงสด',p:25,e:'🥤',img:''},
{id:11,c:'เครื่องดื่ม',n:'สตอเบอร์รี่นมสด',d:'สดชื่น หวานเปรี้ยว',p:25,e:'🍼',img:''},
{id:12,c:'เครื่องดื่ม',n:'โกโก้อ้วน',d:'',p:25,e:'🍼',img:''}
];
const SW=[['หวานน้อย','25%'],['หวานปกติ','50%'],['หวานมาก','100%'],['หวานอ้วน','200%']],hasSw=m=>m.c=='เครื่องดื่ม';
const prod=k=>MENU.find(m=>m.id==parseInt(k)),swOf=k=>String(k).split(':')[1]||'';
function add(k){chg(k,1);toast('เพิ่มลงตะกร้าแล้ว')}
function askSw(id){const m=prod(id);$('#mTitle').textContent=m.n;$('#mOpts').innerHTML=SW.map(v=>`<button class="opt" onclick="pickSw(${id},'${v[0]} ${v[1]}')"><span>${v[0]}</span><b>${v[1]}</b></button>`).join('');$('#modal').hidden=false}
function pickSw(id,v){closeSw();add(id+':'+v)}
function closeSw(){$('#modal').hidden=true}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeSw()});
const face=m=>m.img?`<img src="${m.img}" alt="${m.n}" loading="lazy" onerror="this.outerHTML='${m.e||'🍰'}'">`:(m.e||'🍰');
const CATS=['ทั้งหมด',...new Set(MENU.map(m=>m.c))];
let cat='ทั้งหมด',cart={},orders=[],me={};
const $=s=>document.querySelector(s),fmt=n=>'฿'+n.toLocaleString('th-TH');
try{cart=JSON.parse(localStorage.getItem('ouan-cart')||'{}');orders=JSON.parse(localStorage.getItem('ouan-orders')||'[]');me=JSON.parse(localStorage.getItem('ouan-me')||'{}')}catch(e){}
function save(){try{localStorage.setItem('ouan-cart',JSON.stringify(cart));localStorage.setItem('ouan-orders',JSON.stringify(orders));localStorage.setItem('ouan-me',JSON.stringify(me))}catch(e){}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const total=()=>Object.entries(cart).reduce((a,[id,q])=>a+prod(id).p*q,0);
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();render()}
function ctl(id){const q=cart[id]||0;return q?`<div class="qty"><button class="m" onclick="chg('${id}',-1)" aria-label="ลด">−</button>${q}<button onclick="chg('${id}',1)" aria-label="เพิ่ม">+</button></div>`:`<button class="add" onclick="chg('${id}',1);toast('เพิ่มลงตะกร้าแล้ว')" aria-label="เพิ่มลงตะกร้า">+</button>`}
function render(){
  $('#chips').innerHTML=CATS.map(c=>`<button class="${c==cat?'on':''}" onclick="cat='${c}';render()">${c}</button>`).join('');
  $('#grid').innerHTML=MENU.filter(m=>cat=='ทั้งหมด'||m.c==cat).map(m=>`<div class="item"><div class="pic">${face(m)}</div><h3>${m.n}</h3><small>${m.d}</small><div class="row"><span class="price">${fmt(m.p)}</span>${hasSw(m)?`<button class="add" onclick="askSw(${m.id})" aria-label="เพิ่มลงตะกร้า">+</button>`:ctl(m.id)}</div></div>`).join('');
  const q=count();$('#bar').hidden=!q||$('.view.on').id!='v-menu';$('#barQ').textContent=q+' รายการ · ดูตะกร้า';$('#barT').textContent=fmt(total());
  renderCart();renderOrders();
}
function renderCart(){
  const ids=Object.keys(cart);
  if(!ids.length){$('#cartBody').innerHTML='<div class="empty"><i>🛒</i>ตะกร้ายังว่าง<br>เลือกขนมที่ชอบจากหน้าเมนูได้เลย</div>';return}
  const ship=total()>=200?0:25;
  $('#cartBody').innerHTML=`<h2 style="font-size:18px">ตะกร้าของฉัน</h2><div class="card">${ids.map(id=>{const m=prod(id);return `<div class="line"><span>${face(m)} ${m.n}${swOf(id)?' · '+swOf(id):''}<br><small style="color:var(--ink)">${fmt(m.p)}</small></span>${ctl(id)}</div>`}).join('')}</div>
  <div class="card"><div class="line"><span>ค่าขนม</span><span>${fmt(total())}</span></div><div class="line"><span>ค่าส่ง</span><span>${ship?fmt(ship):'ฟรี'}</span></div><div class="line"><b>รวมทั้งหมด</b><b class="price">${fmt(total()+ship)}</b></div></div>
  <div class="card"><label>ชื่อ</label><input id="oName" value="${me.name||''}"><label>เบอร์โทร</label><input id="oTel" inputmode="tel" value="${me.tel||''}"><label>ที่อยู่จัดส่ง</label><textarea id="oAddr" rows="2">${me.addr||''}</textarea><label>วิธีรับของ</label><select id="oWay" onchange="updatePay()"><option>จัดส่ง</option><option>รับที่ร้าน</option></select><label>วิธีชำระเงิน</label><input id="oPay" value="โอนเงิน / พร้อมเพย์" readonly><label>หมายเหตุ</label><input id="oNote" placeholder="เช่น ไม่หวานมาก"><div id="payBox"></div></div>
  <button class="cta" onclick="order()">ยืนยันสั่งซื้อ</button>`;updatePay();
}
async function order(){
  const name=$('#oName').value.trim(),tel=$('#oTel').value.trim(),addr=$('#oAddr').value.trim(),way=$('#oWay').value;
  if(!name||!tel||(way=='จัดส่ง'&&!addr)){toast('กรอกชื่อ เบอร์โทร และที่อยู่ให้ครบ');return}
  me={name,tel,addr};
  const items=Object.entries(cart).map(([id,q])=>{const m=prod(id);return {n:m.n+(swOf(id)?' ('+swOf(id)+')':''),q,p:m.p}});
  const ship=way=='จัดส่ง'&&total()<200?25:0;
  const slipFile=$('#oSlip')&&$('#oSlip').files[0],payM=$('#oPay').value;if(payM.startsWith('โอน')&&!slipFile){toast('แนบสลิปโอนเงินก่อน');return}const rec={no:'OU'+String(Date.now()).slice(-5),t:new Date().toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}),items,sum:total()+ship,way,pay:payM,note:$('#oNote').value,name,tel,addr};
  const btn=document.querySelector('.cta[onclick="order()"]');btn.disabled=true;btn.textContent='กำลังส่งออเดอร์...';
  try{if(ENDPOINT){const slip=slipFile?await shrink(slipFile):'';const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...rec,slip})});const j=await r.json();if(!j.ok)throw 0}}catch(e){btn.disabled=false;btn.textContent='ยืนยันสั่งซื้อ';toast('ส่งออเดอร์ไม่สำเร็จ ลองใหม่อีกครั้ง');return}
  rec.sent=!!ENDPOINT;orders.unshift(rec);cart={};save();render();go('orders');toast(rec.sent?'สั่งซื้อสำเร็จ! ร้านได้รับออเดอร์แล้ว':'บันทึกออเดอร์แล้ว (โหมดทดลอง ยังไม่เชื่อมระบบร้าน)');
}
const ENDPOINT='',PP='0909601347'; // วาง URL ของ Apps Script ที่ ENDPOINT
function crc(s){let c=0xFFFF;for(const ch of s){c^=ch.charCodeAt(0)<<8;for(let i=0;i<8;i++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(a){const am=a.toFixed(2),s='000201010212'+'2937'+'0016A000000677010111'+'0113'+'0066'+PP.slice(1)+'5303764'+'54'+String(am.length).padStart(2,'0')+am+'5802TH'+'6304';return s+crc(s)}
function updatePay(){const b=$('#payBox');if(!b)return;const amt=total()+($('#oWay').value=='จัดส่ง'&&total()<200?25:0);if(!$('#oPay').value.startsWith('โอน')){b.innerHTML='';return}
 b.innerHTML=`<div class="qrwrap"><b>สแกนจ่ายพร้อมเพย์</b><div id="qr"></div><span class="amt">${fmt(amt)}</span></div><small style="color:var(--ink)">พร้อมเพย์ ${PP} · โอนแล้วแนบสลิปด้านล่าง</small><label style="display:block;margin-top:10px">แนบสลิปโอนเงิน</label><input type="file" id="oSlip" accept="image/*" onchange="prev(this)"><img id="slipPrev" class="slip" alt="สลิป" hidden>`;
 if(window.QRCode){new QRCode($('#qr'),{text:ppPayload(amt),width:200,height:200,colorDark:'#2b3a8f',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});const lg=document.createElement('img');lg.className='qlogo';lg.alt='';lg.src=document.querySelector('header img').src;$('#qr').appendChild(lg)}}
function prev(i){const f=i.files[0],p=$('#slipPrev');if(f){p.src=URL.createObjectURL(f);p.hidden=false}}
function shrink(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};im.onerror=no;im.src=URL.createObjectURL(f)})}
function renderOrders(){
  $('#orders').innerHTML=orders.length?orders.map((o,i)=>`<div class="card"><div class="line"><b>#${o.no} ${o.sent?'✅':''}</b><small>${o.t}</small></div>${o.items.map(x=>`<div class="line"><span>${x.n} ×${x.q}</span><span>${fmt(x.p*x.q)}</span></div>`).join('')}<div class="line"><b>รวม ${fmt(o.sum)}</b><span>${o.way} · ${o.pay}</span></div><button class="cta" style="margin-top:8px;font-size:14px;padding:11px" onclick="copyOrder(${i})">คัดลอกออเดอร์ส่งให้ร้าน</button></div>`).join(''):'<div class="empty"><i>🧾</i>ยังไม่มีออเดอร์</div>';
}
function copyOrder(i){const o=orders[i];const t=`ออเดอร์ #${o.no}\n${o.items.map(x=>`- ${x.n} ×${x.q}`).join('\n')}\nรวม ${fmt(o.sum)} (${o.way}, ${o.pay})\nชื่อ ${o.name} โทร ${o.tel}\n${o.addr}\n${o.note?'หมายเหตุ: '+o.note:''}`;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('คัดลอกแล้ว ส่งให้ร้านทาง LINE ได้เลย')).catch(()=>toast('คัดลอกไม่ได้ ลองกดค้างที่ข้อความ'))}
function go(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id=='v-'+v));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));render();window.scrollTo(0,0)}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};
$('#bar').onclick=()=>go('cart');
$('#saveMe').onclick=()=>{me={name:$('#pName').value,tel:$('#pTel').value,addr:$('#pAddr').value};save();toast('บันทึกแล้ว')};
$('#pName').value=me.name||'';$('#pTel').value=me.tel||'';$('#pAddr').value=me.addr||'';
document.addEventListener('pointermove',e=>{document.querySelectorAll('.eye').forEach(el=>{const r=el.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(8,d/20);el.firstChild.style.transform=`translate(${dx/d*k}px,${dy/d*k}px)`})});
render();
</script>
</body>
</html>
